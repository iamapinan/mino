[package]
name = "mimo"
version = "0.1.1"
description = "A tiny cartoon pet for the macOS menu bar"
authors = ["Mimo"]
edition = "2021"

[lib]
name = "mimo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
